name: guanseq

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: guanseq
      POSTGRES_USER: guanseq
      POSTGRES_PASSWORD: guanseq_dev
    ports:
      - "${GUANSEQ_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guanseq -d guanseq"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - guanseq-postgres-data:/var/lib/postgresql

volumes:
  guanseq-postgres-data:
