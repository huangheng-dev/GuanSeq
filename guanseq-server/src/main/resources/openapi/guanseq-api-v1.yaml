      summary: 查询生产报工、质量判定和入库证据
      tags: [Production]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 生产报工详情
          content: { application/json: { schema: { $ref: "#/components/schemas/ProductionWorkReport" } } }
        "404": { description: 报工不存在或不可见 }
  /api/v1/production/work-reports/{id}/settle:
    post:
      operationId: settleProductionWorkReport
      summary: 按完工检验判定结算报工并将合格数量入库
      tags: [Production]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SettleProductionWorkReportRequest" } } }
      responses:
        "200":
          description: 已结算的生产报工与库存入账证据
          content: { application/json: { schema: { $ref: "#/components/schemas/ProductionWorkReport" } } }
        "409": { description: 检验未完成、重复结算或版本冲突 }
        "422": { description: 合格数量缺少成品仓库、库位或批次 }
  /api/v1/quality/final-inspections:
    get:
      operationId: listFinalInspections
      summary: 分页查询生产完工检验任务
      tags: [Quality]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, PENDING, COMPLETED], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 完工检验任务分页
          content: { application/json: { schema: { $ref: "#/components/schemas/FinalInspectionPage" } } }
  /api/v1/quality/final-inspections/{id}:
    get:
      operationId: getFinalInspection
      summary: 查询完工检验任务和判定证据
      tags: [Quality]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 完工检验详情
          content: { application/json: { schema: { $ref: "#/components/schemas/FinalInspection" } } }
        "404": { description: 检验任务不存在或不可见 }
  /api/v1/quality/final-inspections/{id}/complete:
    post:
      operationId: completeFinalInspection
      summary: 提交一次性完工检验判定
      tags: [Quality]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteFinalInspectionRequest" } } }
      responses:
        "200":
          description: 已完成的完工检验
          content: { application/json: { schema: { $ref: "#/components/schemas/FinalInspection" } } }
        "409": { description: 检验已经判定或版本冲突 }
        "422": { description: 数量合计或缺陷说明不符合检验规则 }
  /api/v1/quality/incoming-inspections:
    get:
      operationId: listIncomingInspections
      summary: 分页查询来料检验任务
      tags: [Quality]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 来料检验任务分页
          content: { application/json: { schema: { $ref: "#/components/schemas/IncomingInspectionPage" } } }
  /api/v1/quality/incoming-inspections/{id}:
    get:
      operationId: getIncomingInspection
      summary: 获取来料检验任务详情
      tags: [Quality]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 来料检验任务详情
          content: { application/json: { schema: { $ref: "#/components/schemas/IncomingInspection" } } }
        "404": { description: 检验任务不存在或不可见 }
  /api/v1/quality/incoming-inspections/{id}/complete:
    post:
      operationId: completeIncomingInspection
      summary: 提交来料检验结论并自动结算库存
      tags: [Quality]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteIncomingInspectionRequest" } } }
      responses:
        "200":
          description: 已完成的来料检验任务
          content: { application/json: { schema: { $ref: "#/components/schemas/IncomingInspection" } } }
        "403": { description: 无权提交检验结论 }
        "409": { description: 检验已经判定或版本冲突 }
        "422": { description: 数量合计或缺陷说明不符合检验规则 }
  /api/v1/planning/material-parameters:
    get:
      operationId: listMaterialPlanningParameters
      summary: 分页查询物料计划参数
      tags: [Planning]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 物料计划参数分页
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialPlanningParameterPage" } } }
  /api/v1/planning/material-parameters/{materialId}:
    put:
      operationId: updateMaterialPlanningParameter
      summary: 创建或修改受控提前期
      tags: [Planning]
      security: [{ basicAuth: [] }]
      parameters:
        - name: materialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMaterialPlanningParameterRequest" } } }
      responses:
        "200":
          description: 已保存物料计划参数
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialPlanningParameter" } } }
        "409": { description: 乐观锁冲突 }
  /api/v1/production/material-issues:
    get:
      operationId: listMaterialIssues
      summary: 分页查询生产领料单
      tags: [Production]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 生产领料单分页
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssuePage" } } }
    post:
      operationId: createMaterialIssue
      summary: 根据生产订单和生效 BOM 生成生产领料单
      tags: [Production]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateMaterialIssueRequest" } } }
      responses:
        "200":
          description: 已生成的生产领料单
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssue" } } }
        "409": { description: 生产订单已有未取消领料单或状态不允许 }
        "422": { description: 订单状态、仓库或 BOM 不满足生成条件 }
  /api/v1/production/material-issues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMaterialIssue
      summary: 查询生产领料单详情
      tags: [Production]
      security: [{ basicAuth: [] }]
      responses:
        "200":
          description: 生产领料单详情
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssue" } } }
        "404": { description: 领料单不存在或不可见 }
  /api/v1/production/material-issues/{id}/actions:
    post:
      operationId: actOnMaterialIssue
      summary: 发料或取消生产领料单
      tags: [Production]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssueActionRequest" } } }
      responses:
        "200":
          description: 动作后的领料单
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssue" } } }
        "409": { description: 状态或并发版本冲突 }
        "422": { description: 库存不足、数量越界或目标库位无效 }
  /api/v1/production/material-issues/{id}/returns:
    post:
      operationId: createMaterialReturn
      summary: 将已领组件退回仓库
      tags: [Production]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialReturnRequest" } } }
      responses:
        "200":
          description: 退料后的领料单
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssue" } } }
        "409": { description: 并发版本冲突或领料单尚未发料 }
        "422": { description: 退料数量越界、库位无效或库存回补失败 }
  /api/v1/production/material-issue-reference-data:
    get:
      operationId: getMaterialIssueReferenceData
      summary: 获取可备料订单、仓库和库位
      tags: [Production]
      security: [{ basicAuth: [] }]
      responses:
        "200":
          description: 生产领料参考数据
          content: { application/json: { schema: { $ref: "#/components/schemas/MaterialIssueReferenceData" } } }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 仅用于当前本地开发身份适配器，正式身份接入后替换。
  headers:
    RequestId:
      description: 用于日志和审计追踪的请求编号
      schema:
        type: string
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Query:
      name: query
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string, enum: [ALL, ACTIVE, INACTIVE], default: ALL }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
  schemas:
    PlatformStatus:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - version
      properties:
        service:
          type: string
          const: guanseq-server
        status:
          type: string
          enum:
            - UP
        version:
          type: string
    WorkspaceSession:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - displayName
        - currentWorkspaceId
        - selectionVersion
        - workspaces
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        currentWorkspaceId:
          type: string
          format: uuid
        selectionVersion:
          type: integer
          format: int64
          minimum: 0
        workspaces:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - organizationId
        - companyName
        - roleCode
        - current
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        organizationId:
          type: string
          format: uuid
        companyName:
          type: string
        roleCode:
          type: string
        current:
          type: boolean
    SwitchWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - expectedVersion
      properties:
        workspaceId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    CustomerPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Customer" }
    MaterialPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Material" }
    PageMetadata:
      type: object
      required: [totalElements, page, size, totalPages]
      properties:
        totalElements: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
    Customer:
      type: object
      required: [id, code, name, customerType, creditLevel, owner, status, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        customerType: { type: string, enum: [ENTERPRISE, DISTRIBUTOR, INTERNAL] }
        creditLevel: { type: string, enum: [A, B, C] }
        contactName: { type: [string, "null"] }
        contactPhone: { type: [string, "null"] }
        owner: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    Material:
      type: object
      required: [id, code, name, materialType, baseUnit, procurementType, incomingInspectionRequired, owner, status, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        specification: { type: [string, "null"] }
        materialType: { type: string, enum: [FINISHED_GOOD, SEMI_FINISHED, RAW_MATERIAL, PACKAGING, CONSUMABLE] }
        baseUnit: { type: string }
        procurementType: { type: string, enum: [MAKE, BUY, OUTSOURCE] }
        incomingInspectionRequired: { type: boolean }
        owner: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [code, name, customerType, creditLevel, owner]
      properties:
        code: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 160 }
        customerType: { type: string, enum: [ENTERPRISE, DISTRIBUTOR, INTERNAL] }
        creditLevel: { type: string, enum: [A, B, C] }
        contactName: { type: [string, "null"], maxLength: 80 }
        contactPhone: { type: [string, "null"], maxLength: 40 }
        owner: { type: string, maxLength: 80 }
    UpdateCustomerRequest:
      allOf:
        - $ref: "#/components/schemas/CreateCustomerRequest"
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 0 }
    CreateMaterialRequest:
      type: object
      additionalProperties: false
      required: [code, name, materialType, baseUnit, procurementType, owner]
      properties:
        code: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 160 }
        specification: { type: [string, "null"], maxLength: 240 }
        materialType: { type: string, enum: [FINISHED_GOOD, SEMI_FINISHED, RAW_MATERIAL, PACKAGING, CONSUMABLE] }
        baseUnit: { type: string, maxLength: 20 }
        procurementType: { type: string, enum: [MAKE, BUY, OUTSOURCE] }
        owner: { type: string, maxLength: 80 }
    UpdateMaterialRequest:
      allOf:
        - $ref: "#/components/schemas/CreateMaterialRequest"
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 0 }
    BomPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Bom" }
    Bom:
      type: object
      required: [id, bomNumber, parentMaterialId, parentMaterialCode, parentMaterialName, parentUnit, usageType, versionCode, baseQuantity, effectiveFrom, owner, changeReason, status, version, updatedAt, lines, events]
      properties:
        id: { type: string, format: uuid }
        bomNumber: { type: string }
        parentMaterialId: { type: string, format: uuid }
        parentMaterialCode: { type: string }
        parentMaterialName: { type: string }
        parentMaterialSpecification: { type: [string, "null"] }
        parentUnit: { type: string }
        usageType: { type: string, enum: [PRODUCTION] }
        versionCode: { type: string }
        baseQuantity: { type: number, exclusiveMinimum: 0 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        owner: { type: string }
        changeReason: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, INACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BomLine" }
        events:
          type: array
          items: { $ref: "#/components/schemas/BomEvent" }
    BomLine:
      type: object
      required: [id, lineNumber, componentMaterialId, componentMaterialCode, componentMaterialName, unit, quantity, scrapRate]
      properties:
        id: { type: string, format: uuid }
        lineNumber: { type: integer, minimum: 1 }
        componentMaterialId: { type: string, format: uuid }
        componentMaterialCode: { type: string }
        componentMaterialName: { type: string }
        componentMaterialSpecification: { type: [string, "null"] }
        unit: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        scrapRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
        note: { type: [string, "null"] }
    BomEvent:
      type: object
      required: [id, action, toStatus, occurredAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [CREATED, UPDATED, PUBLISHED, INACTIVATED] }
        fromStatus: { type: [string, "null"], enum: [DRAFT, PUBLISHED, INACTIVE, null] }
        toStatus: { type: string, enum: [DRAFT, PUBLISHED, INACTIVE] }
        requestId: { type: [string, "null"] }
        details: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    BomLineInput:
      type: object
      additionalProperties: false
      required: [componentMaterialId, quantity, scrapRate]
      properties:
        componentMaterialId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        scrapRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
        note: { type: [string, "null"], maxLength: 240 }
    CreateBomRequest:
      type: object
      additionalProperties: false
      required: [parentMaterialId, usageType, versionCode, baseQuantity, effectiveFrom, owner, changeReason, lines]
      properties:
        parentMaterialId: { type: string, format: uuid }
        usageType: { type: string, enum: [PRODUCTION] }
        versionCode: { type: string, minLength: 1, maxLength: 32 }
        baseQuantity: { type: number, exclusiveMinimum: 0 }
        effectiveFrom: { type: string, format: date }
        owner: { type: string, minLength: 1, maxLength: 80 }
        changeReason: { type: string, minLength: 1, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/BomLineInput" }
    UpdateBomRequest:
      allOf:
        - $ref: "#/components/schemas/CreateBomRequest"
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 0 }
    BomActionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [PUBLISH, INACTIVATE] }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    BomReferenceData:
      type: object
      required: [parentMaterials, componentMaterials]
      properties:
        parentMaterials:
          type: array
          items: { $ref: "#/components/schemas/BomMaterialReference" }
        componentMaterials:
          type: array
          items: { $ref: "#/components/schemas/BomMaterialReference" }
    BomMaterialReference:
      type: object
      required: [id, code, name, baseUnit, procurementType]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        specification: { type: [string, "null"] }
        baseUnit: { type: string }
        procurementType: { type: string, enum: [MAKE, BUY, OUTSOURCE] }
    RoutingPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Routing" }
    Routing:
      type: object
      required: [id, routingNumber, materialId, materialCode, materialName, materialUnit, usageType, versionCode, baseQuantity, effectiveFrom, owner, changeReason, status, version, updatedAt, operations, events]
      properties:
        id: { type: string, format: uuid }
        routingNumber: { type: string }
        materialId: { type: string, format: uuid }
        materialCode: { type: string }
        materialName: { type: string }
        materialSpecification: { type: [string, "null"] }
        materialUnit: { type: string }
        usageType: { type: string, enum: [PRODUCTION] }
        versionCode: { type: string }
        baseQuantity: { type: number, exclusiveMinimum: 0 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        owner: { type: string }
        changeReason: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, INACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        operations:
          type: array
          items: { $ref: "#/components/schemas/RoutingOperation" }
        events:
          type: array
          items: { $ref: "#/components/schemas/RoutingEvent" }
    RoutingOperation:
      type: object
      required: [id, sequenceNumber, operationCode, operationName, workCenterCode, workCenterName, setupMinutes, runMinutesPerUnit, queueMinutes, inspectionRequired]
      properties:
        id: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        operationCode: { type: string }
        operationName: { type: string }
        workCenterCode: { type: string }
        workCenterName: { type: string }
        setupMinutes: { type: number, minimum: 0 }
        runMinutesPerUnit: { type: number, minimum: 0 }
        queueMinutes: { type: number, minimum: 0 }
        inspectionRequired: { type: boolean }
        instructionSummary: { type: [string, "null"] }
    RoutingEvent:
      type: object
      required: [id, action, toStatus, occurredAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [CREATED, UPDATED, PUBLISHED, INACTIVATED] }
        fromStatus: { type: [string, "null"], enum: [DRAFT, PUBLISHED, INACTIVE, null] }
        toStatus: { type: string, enum: [DRAFT, PUBLISHED, INACTIVE] }
        requestId: { type: [string, "null"] }
        details: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    RoutingOperationInput:
      type: object
      additionalProperties: false
      required: [operationCode, operationName, workCenterCode, workCenterName, setupMinutes, runMinutesPerUnit, queueMinutes, inspectionRequired]
      properties:
        operationCode: { type: string, minLength: 1, maxLength: 40 }
