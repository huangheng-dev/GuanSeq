openapi: 3.1.0
info:
  title: GuanSeq API
  version: 0.1.0
  description: GuanSeq 制造业务核心 API 契约。
paths:
  /api/v1/platform/status:
    get:
      operationId: getPlatformStatus
      summary: 获取业务核心运行状态
      tags:
        - Platform
      responses:
        "200":
          description: 业务核心可以响应请求
          headers:
            X-Request-Id:
              description: 用于日志和审计追踪的请求编号
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
  /api/v1/me/workspaces:
    get:
      operationId: getMyWorkspaces
      summary: 获取当前用户可访问的工作区
      tags:
        - Identity
      security:
        - basicAuth: []
      responses:
        "200":
          description: 当前用户、工作区选择版本和可访问工作区
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: 未认证
        "403":
          description: 当前用户没有可访问工作区
  /api/v1/me/current-workspace:
    put:
      operationId: switchMyWorkspace
      summary: 切换当前用户工作区
      tags:
        - Identity
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchWorkspaceRequest"
      responses:
        "200":
          description: 切换后的工作区会话
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "400":
          description: 请求数据无效
        "401":
          description: 未认证
        "403":
          description: 无权访问目标工作区
        "409":
          description: 工作区选择版本冲突
  /api/v1/masterdata/customers:
    get:
      operationId: listCustomers
      summary: 分页查询当前工作区可见的客户
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 客户分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
    post:
      operationId: createCustomer
      summary: 新建客户
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "200":
          description: 已创建客户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409": { description: 客户编码已存在 }
  /api/v1/masterdata/customers/{id}:
    put:
      operationId: updateCustomer
      summary: 更新客户
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "200":
          description: 已更新客户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { description: 客户不存在或不可见 }
        "409": { description: 版本冲突或客户编码已存在 }
  /api/v1/masterdata/customers/batch:
    patch:
      operationId: batchUpdateCustomers
      summary: 批量更新客户状态或负责人
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterDataBatchRequest" }
      responses:
        "200":
          description: 已更新的客户
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
        "409": { description: 任一记录版本冲突 }
  /api/v1/masterdata/materials:
    get:
      operationId: listMaterials
      summary: 分页查询当前工作区可见的物料
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 物料分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialPage" }
    post:
      operationId: createMaterial
      summary: 新建物料
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaterialRequest" }
      responses:
        "200":
          description: 已创建物料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "409": { description: 物料编码已存在 }
  /api/v1/masterdata/materials/{id}:
    put:
      operationId: updateMaterial
      summary: 更新物料
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMaterialRequest" }
      responses:
        "200":
          description: 已更新物料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "404": { description: 物料不存在或不可见 }
        "409": { description: 版本冲突或物料编码已存在 }
  /api/v1/masterdata/materials/batch:
    patch:
      operationId: batchUpdateMaterials
      summary: 批量更新物料状态或负责人
      tags: [MasterData]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterDataBatchRequest" }
      responses:
        "200":
          description: 已更新的物料
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
        "409": { description: 任一记录版本冲突 }
  /api/v1/sales/orders:
    get:
      operationId: listSalesOrders
      summary: 分页查询当前租户销售订单
      tags: [Sales]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 销售订单分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrderPage" }
    post:
      operationId: createSalesOrder
      summary: 创建销售订单草稿
      tags: [Sales]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSalesOrderRequest" }
      responses:
        "200":
          description: 已创建销售订单草稿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "422": { description: 客户、物料或交期不满足业务约束 }
  /api/v1/sales/orders/{id}:
    get:
      operationId: getSalesOrder
      summary: 获取销售订单详情
      tags: [Sales]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 销售订单详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "404": { description: 订单不存在或不可见 }
    put:
      operationId: updateSalesOrder
      summary: 编辑草稿或已驳回销售订单
      tags: [Sales]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSalesOrderRequest" }
      responses:
        "200":
          description: 已更新销售订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "409": { description: 状态或版本冲突 }
        "422": { description: 客户、物料或交期不满足业务约束 }
  /api/v1/sales/orders/{id}/actions:
    post:
      operationId: actOnSalesOrder
      summary: 提交、审核、驳回或下达销售订单
      tags: [Sales]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesOrderActionRequest" }
      responses:
        "200":
          description: 状态流转后的销售订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "400": { description: 驳回原因等动作参数无效 }
        "403": { description: 当前角色无权执行动作 }
        "409": { description: 状态或版本冲突 }
  /api/v1/sales/order-reference-data:
    get:
      operationId: getSalesOrderReferenceData
      summary: 获取当前租户可用于订单的客户和物料
      tags: [Sales]
      security: [{ basicAuth: [] }]
      responses:
        "200":
          description: 启用中的客户和物料选项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrderReferenceData" }
  /api/v1/sales/shipments:
    get:
      operationId: listSalesShipments
      summary: 分页查询销售发货单
      tags: [Sales]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 销售发货单分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesShipmentPage" }
    post:
      operationId: createSalesShipment
      summary: 登记销售发货并扣减合格成品库存
      tags: [Sales]
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSalesShipmentRequest" }
      responses:
        "200":
          description: 已发货
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesShipment" }
        "403": { description: 当前角色无权发货 }
        "409": { description: 订单版本、请求编号或并发冲突 }
        "422": { description: 订单状态、库存或未发数量不满足约束 }
  /api/v1/sales/shipments/{id}:
    get:
      operationId: getSalesShipment
      summary: 获取销售发货单详情
      tags: [Sales]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 销售发货单详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesShipment" }
        "404": { description: 发货单不存在或不可见 }
  /api/v1/sales/shipment-reference-data:
    get:
      operationId: getSalesShipmentReferenceData
      summary: 获取可发货订单和发货仓库
      tags: [Sales]
      security: [{ basicAuth: [] }]
      responses:
        "200":
          description: 可发货订单与仓库
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesShipmentReferenceData" }
  /api/v1/finance/order-profits:
    get:
      operationId: listOrderProfits
      summary: 分页查询订单利润结算
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: costStatus
          in: query
          schema: { type: string, enum: [ALL, COMPLETE, MISSING_COST], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 订单利润结算分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderProfitPage" }
  /api/v1/finance/work-center-cost-rates:
    get:
      operationId: listWorkCenterCostRates
      summary: 分页查询当前经营组织的工作中心成本费率
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, ACTIVE, INACTIVE], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 工作中心成本费率分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkCenterCostRatePage" }
    post:
      operationId: createWorkCenterCostRate
      summary: 发布工作中心人工与制造费用小时费率
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkCenterCostRateRequest" }
      responses:
        "200":
          description: 已发布或幂等返回工作中心成本费率
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkCenterCostRate" }
        "403": { description: 当前角色无权发布成本费率 }
        "409": { description: 生效日期、请求编号或并发冲突 }
        "422": { description: 费率不满足业务约束 }
  /api/v1/finance/work-center-cost-rates/{id}/status:
    post:
      operationId: changeWorkCenterCostRateStatus
      summary: 启用或停用工作中心成本费率
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeWorkCenterCostRateStatusRequest" }
      responses:
        "200":
          description: 已变更或幂等返回成本费率
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkCenterCostRate" }
        "403": { description: 当前角色无权变更成本费率 }
        "404": { description: 成本费率不存在或不可见 }
        "409": { description: 版本、请求编号或并发冲突 }
        "422": { description: 目标状态与当前状态相同 }
  /api/v1/finance/receivable-invoices:
    get:
      operationId: listReceivableInvoices
      summary: 分页查询销售应收发票
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, OPEN, PARTIALLY_PAID, PAID, CREDIT_PENDING, SETTLED], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 应收发票分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableInvoicePage" }
    post:
      operationId: createReceivableInvoice
      summary: 按已发货销售订单开具应收发票
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReceivableInvoiceRequest" }
      responses:
        "200":
          description: 已创建或幂等返回应收发票
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableInvoice" }
        "403": { description: 当前角色无权开票 }
        "409": { description: 请求编号或并发冲突 }
        "422": { description: 日期、订单状态或可开票数量不满足约束 }
  /api/v1/finance/receivable-invoices/{id}:
    get:
      operationId: getReceivableInvoice
      summary: 获取应收发票详情及收款记录
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 应收发票详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableInvoice" }
        "404": { description: 应收发票不存在或不可见 }
  /api/v1/finance/receivable-invoices/{id}/receipts:
    post:
      operationId: postReceivableReceipt
      summary: 登记收款并核销指定应收发票
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostReceivableReceiptRequest" }
      responses:
        "200":
          description: 已登记收款并返回更新后的发票
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableInvoice" }
        "403": { description: 当前角色无权登记收款 }
        "409": { description: 发票版本、请求编号或并发冲突 }
        "422": { description: 收款日期或金额不满足约束 }
  /api/v1/finance/receivable-reference-data:
    get:
      operationId: getReceivableReferenceData
      summary: 获取已发货订单及其剩余可开票数量
      tags: [Finance]
      security: [{ basicAuth: [] }]
      responses:
        "200":
          description: 可开票销售订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableReferenceData" }
  /api/v1/finance/receivable-credit-notes:
    get:
      operationId: listReceivableCreditNotes
      summary: 分页查询应收红字发票
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 应收红字发票分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableCreditNotePage" }
    post:
      operationId: createReceivableCreditNote
      summary: 对已过账应收发票开具红字发票
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReceivableCreditNoteRequest" }
      responses:
        "200":
          description: 已过账红字发票
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableCreditNote" }
        "403": { description: 当前角色无权开具红字发票 }
        "409": { description: 请求编号或并发冲突 }
        "422": { description: 日期、数量或原发票状态不满足约束 }
  /api/v1/finance/receivable-credit-notes/{id}:
    get:
      operationId: getReceivableCreditNote
      summary: 获取应收红字发票详情
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 红字发票详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableCreditNote" }
        "404": { description: 红字发票不存在或不可见 }
  /api/v1/finance/receivable-invoices/{id}/refunds:
    post:
      operationId: postReceivableRefund
      summary: 对存在待退余额的应收发票登记退款
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostReceivableRefundRequest" }
      responses:
        "200":
          description: 已登记退款并返回更新后的发票
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivableInvoice" }
        "403": { description: 当前角色无权登记退款 }
        "409": { description: 发票版本、请求编号或并发冲突 }
        "422": { description: 退款日期、金额或待退余额不满足约束 }
  /api/v1/finance/receivables/receipts/{id}/reverse:
    post:
      operationId: reverseReceivableReceipt
      summary: 反核销一笔应收收款或退款
      tags: [Finance]
      security: [{ basicAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
