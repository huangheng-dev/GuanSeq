        status: { type: string, enum: [PREPARED], description: 不代表物理打印成功 }
        actorUsername: { type: string }
        requestId: { type: string }
        preparedAt: { type: string, format: date-time }
    PrepareLabelPrintRequest:
      type: object
      additionalProperties: false
      required: [objectType, objectId, expectedObjectVersion, mode, copies]
      properties:
        objectType: { type: string, enum: [OPERATION_TASK, EMPLOYEE, STOCK_BALANCE] }
        objectId: { type: string, format: uuid }
        expectedObjectVersion: { type: integer, format: int64, minimum: 0 }
        mode: { type: string, enum: [INITIAL, REPRINT] }
        copies: { type: integer, minimum: 1, maximum: 10 }
        reason: { type: [string, "null"], maxLength: 300, description: 补打时至少 4 个字符 }
    LabelReferenceData:
      type: object
      additionalProperties: false
      required: [allowedObjectTypes, templates, candidates]
      properties:
        allowedObjectTypes:
          type: array
          items: { type: string, enum: [OPERATION_TASK, EMPLOYEE, STOCK_BALANCE] }
        templates:
          type: array
          items: { $ref: "#/components/schemas/LabelTemplate" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/LabelCandidate" }
    LabelTemplate:
      type: object
      additionalProperties: false
      required: [objectType, code, name, version, paperSize]
      properties:
        objectType: { type: string, enum: [OPERATION_TASK, EMPLOYEE, STOCK_BALANCE] }
        code: { type: string, enum: [OT, EMP, STOCK] }
        name: { type: string }
        version: { type: string, enum: [OT-V1, EMP-V1, STOCK-V1] }
        paperSize: { type: string }
    LabelCandidate:
      type: object
      additionalProperties: false
      required: [objectType, objectId, version, code, name, detail, payload, hasPreparedRequest]
      properties:
        objectType: { type: string, enum: [OPERATION_TASK, EMPLOYEE, STOCK_BALANCE] }
        objectId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        code: { type: string }
        name: { type: string }
        detail: { type: string }
        payload: { type: string }
        hasPreparedRequest: { type: boolean }
