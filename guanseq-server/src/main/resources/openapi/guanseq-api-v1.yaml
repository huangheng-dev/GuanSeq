        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
        "422": { $ref: "#/components/responses/BusinessRuleViolation" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 正式环境使用的 OAuth 2.0 Bearer JWT；本地 Basic 适配器不属于生产契约。
  responses:
    ValidationFailed:
      description: 请求格式、字段或参数校验失败
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    AuthenticationRequired:
      description: 尚未完成身份认证
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    AccessDenied:
      description: 当前身份无权访问目标资源或执行目标动作
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ResourceNotFound:
      description: 目标资源不存在或在当前数据范围内不可见
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BusinessConflict:
      description: 状态、幂等请求或乐观锁发生业务冲突
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BusinessRuleViolation:
      description: 请求违反当前业务规则
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InternalError:
      description: 系统暂时无法完成请求
      headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  headers:
    RequestId:
      description: 用于日志和审计追踪的请求编号
      schema:
        type: string
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Query:
      name: query
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string, enum: [ALL, ACTIVE, INACTIVE], default: ALL }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
  schemas:
    EquipmentAssetPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items, canMaintain]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/EquipmentAsset" } }
            canMaintain: { type: boolean, description: 当前工作区角色是否可维护设备事实 }
    EquipmentAsset:
      type: object
      additionalProperties: false
      required: [id, assetCode, assetName, category, location, responsiblePerson, operatingStatus, statusChangedAt, version, createdAt, updatedAt, events]
      properties:
        id: { type: string, format: uuid }
        assetCode: { type: string }
        assetName: { type: string }
        category: { type: string, enum: [PRODUCTION, QUALITY, UTILITY, LOGISTICS, OTHER] }
        manufacturer: { type: [string, "null"] }
        model: { type: [string, "null"] }
        serialNumber: { type: [string, "null"] }
        workCenterCode: { type: [string, "null"] }
        workCenterName: { type: [string, "null"] }
        location: { type: string }
        responsiblePerson: { type: string }
        commissioningDate: { type: [string, "null"], format: date }
        operatingStatus: { type: string, enum: [IDLE, RUNNING, DOWN, MAINTENANCE, INACTIVE] }
        statusChangedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/EquipmentAssetEvent" } }
    EquipmentAssetEvent:
      type: object
      additionalProperties: false
      required: [id, actorUserId, action, toStatus, reason, requestId, details, verification, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string, enum: [CREATED, UPDATED, STARTED, STOPPED, BREAKDOWN_REPORTED, MAINTENANCE_STARTED, MAINTENANCE_COMPLETED, INACTIVATED] }
        fromStatus: { type: [string, "null"], enum: [IDLE, RUNNING, DOWN, MAINTENANCE, INACTIVE, null] }
        toStatus: { type: string, enum: [IDLE, RUNNING, DOWN, MAINTENANCE, INACTIVE] }
        reason: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
        verification:
          anyOf:
            - $ref: "#/components/schemas/EquipmentTelemetryVerification"
            - type: "null"
        occurredAt: { type: string, format: date-time }
    EquipmentTelemetryVerification:
      type: object
      additionalProperties: false
      description: 生产协议技术预检证据；fieldAccepted 固定为 false，不代表现场验收。
      required: [verificationVersion, evidenceLevel, technicalPassed, fieldAccepted, protocol, endpointType, pointCount, returnedPointCount, warningCount, checks, pendingFieldChecks]
      properties:
        verificationVersion: { type: integer, minimum: 1 }
        evidenceLevel: { type: string, enum: [SIMULATION_TECHNICAL, FIELD_CANDIDATE_PRECHECK] }
        technicalPassed: { type: boolean }
        fieldAccepted: { type: boolean, enum: [false] }
        protocol: { type: string, enum: [MODBUS_TCP, MQTT_3_1_1] }
        endpointType: { type: string, enum: [SIMULATOR, PHYSICAL_DEVICE, EXTERNAL_BROKER] }
        pointCount: { type: integer, minimum: 0 }
        returnedPointCount: { type: integer, minimum: 0 }
        warningCount: { type: integer, minimum: 0 }
        checks: { type: array, items: { $ref: "#/components/schemas/EquipmentTelemetryVerificationCheck" } }
        pendingFieldChecks: { type: array, items: { type: string } }
        errorCode: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
    EquipmentTelemetryVerificationCheck:
      type: object
      additionalProperties: false
      required: [code, status, message]
      properties:
        code: { type: string }
        status: { type: string, enum: [PASSED, WARNING, FAILED, INFO] }
