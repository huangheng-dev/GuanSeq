          description: 红字发票详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayableCreditNote" }
        "404": { description: 红字发票不存在或不可见 }
  /api/v1/finance/payable-invoices/{id}/refunds:
    post:
