        "200":
          description: 已登记退款并返回更新后的发票
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayableInvoice" }
        "403": { description: 当前角色无权登记退款 }
        "409":
          description: '发票版本/请求编号/并发冲突，或会计期间已关账（X-Error-Code: PERIOD_CLOSED）'
          headers:
            X-Period-Label: { description: 已关账期间标签, schema: { type: string } }
            X-Error-Code: { description: 业务错误码, schema: { type: string, enum: [PERIOD_CLOSED] } }
        "422": { description: 退款日期、金额或待退余额不满足约束 }
  /api/v1/finance/payables/payments/{id}/reverse:
    post:
      operationId: reversePayablePayment
      summary: 反核销一笔应付付款或退款
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReversePayablePaymentRequest" }
      responses:
        "200":
          description: 已反核销并返回更新后的发票
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayableInvoice" }
        "403": { description: 当前角色无权反核销 }
        "409":
          description: '请求编号/重复反核销/并发冲突，或会计期间已关账（X-Error-Code: PERIOD_CLOSED）'
          headers:
            X-Period-Label: { description: 已关账期间标签, schema: { type: string } }
            X-Error-Code: { description: 业务错误码, schema: { type: string, enum: [PERIOD_CLOSED] } }
        "422": { description: 日期或原因不满足约束 }
        "404": { description: 付款记录不存在或不可见 }
  /api/v1/finance/order-profit-reference-data:
    get:
      operationId: getOrderProfitReferenceData
      summary: 获取可结算订单利润的销售订单
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 可结算订单列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderProfitReferenceData" }
  /api/v1/finance/order-profits/{id}:
    get:
      operationId: getOrderProfit
      summary: 获取订单利润结算详情
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 订单利润结算详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderProfit" }
        "404": { description: 结算不存在或不可见 }
  /api/v1/finance/order-profits/{salesOrderId}/settle:
    post:
      operationId: settleOrderProfit
      summary: 按销售订单生成订单利润结算快照
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: salesOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: 已生成或幂等返回订单利润结算
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderProfit" }
        "403": { description: 当前角色无权结算订单利润 }
        "409":
          description: '请求编号/结算并发冲突，或当前会计期间已关账（X-Error-Code: PERIOD_CLOSED）'
          headers:
            X-Period-Label:
              description: 已关账的期间标签（如 2026-08），PERIOD_CLOSED 时返回
              schema: { type: string }
            X-Error-Code:
              description: 业务错误码，PERIOD_CLOSED 表示期间已关账
              schema: { type: string, enum: [PERIOD_CLOSED] }
        "422": { description: 订单未发货或暂不能结算 }
  /api/v1/finance/order-profits/{salesOrderId}/history:
    get:
      operationId: listOrderProfitHistory
      summary: 按销售订单列出全部利润结算版本（含已被替代的历史版本，按版本号倒序）
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: salesOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 历史版本列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderProfit" }
  /api/v1/finance/order-profits/{salesOrderId}/resettle:
    post:
      operationId: resettleOrderProfit
      summary: 按最新事实（红字发票/退款/反核销/补录成本）重算订单利润，生成新版本快照
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: salesOrderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderProfitResettleRequest" }
      responses:
        "200":
          description: 已生成新利润版本
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderProfit" }
        "403": { description: 当前角色无权重算订单利润 }
        "404": { description: 该销售订单尚无可重算的利润快照 }
        "409":
          description: '乐观锁并发冲突，或当前会计期间已关账（X-Error-Code: PERIOD_CLOSED）'
          headers:
            X-Period-Label:
              description: 已关账的期间标签（如 2026-08），PERIOD_CLOSED 时返回
              schema: { type: string }
            X-Error-Code:
              description: 业务错误码，PERIOD_CLOSED 表示期间已关账
              schema: { type: string, enum: [PERIOD_CLOSED] }
        "422": { description: 重算原因不合规（少于 4 字符或超过 500 字符），或订单已无可结算发货 }
  /api/v1/finance/accounting-periods:
    get:
      operationId: listAccountingPeriods
      summary: 按年度列示会计期间
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          required: false
          description: 会计年度，不传则返回当前年度
          schema: { type: integer, minimum: 2020, maximum: 2099 }
      responses:
        "200":
          description: 该年度 12 个会计期间列表（自动补建缺失期间）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountingPeriod" }
    post:
      operationId: createAccountingPeriod
      summary: 手动创建会计期间（补录历史期间）
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountingPeriodRequest" }
      responses:
        "200":
          description: 已创建或幂等返回会计期间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingPeriod" }
        "403": { description: 当前角色无权维护会计期间 }
        "409": { description: 该期间已存在 }
        "422": { description: 年度或月份超出支持范围 }
  /api/v1/finance/accounting-periods/{id}:
    get:
      operationId: getAccountingPeriod
      summary: 获取单个会计期间详情
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 会计期间详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingPeriod" }
        "404": { description: 会计期间不存在或不在当前租户范围 }
  /api/v1/finance/accounting-periods/{id}/close:
    post:
      operationId: closeAccountingPeriod
      summary: 关账（关闭指定会计期间）
      description: 需要 ADMIN 或 FINANCE_MANAGER 角色。关账后该期间的所有财务写操作将被拒绝（409 PERIOD_CLOSED）。
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: 已关账或幂等返回（期间已是 CLOSED 状态时直接返回当前状态）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingPeriod" }
        "403": { description: 当前角色无权关账 }
        "404": { description: 会计期间不存在或不在当前租户范围 }
        "409": { description: 期间版本冲突，请刷新后重试 }
  /api/v1/finance/accounting-periods/{id}/reopen:
    post:
      operationId: reopenAccountingPeriod
      summary: 重开会计期间（仅 ADMIN）
      description: 重开已关账期间。仅 ADMIN 角色可执行，必须填写重开原因（至少 4 字符）。
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReopenAccountingPeriodRequest" }
      responses:
        "200":
          description: 已重开会计期间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingPeriod" }
        "403": { description: 当前角色无权重开会计期间（仅 ADMIN） }
        "404": { description: 会计期间不存在或不在当前租户范围 }
        "409": { description: 期间版本冲突或期间未关账 }
        "422": { description: 重开原因不满足要求 }
  /api/v1/finance/grir-accruals:
    get:
      operationId: listGrirAccruals
      summary: 分页查询暂估应付单
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ALL, POSTED, REVERSED], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 暂估应付分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrirAccrualPage" }
  /api/v1/finance/grir-accruals/preview:
    get:
      operationId: previewGrirAccrual
      summary: 预览指定年月将暂估的明细（不落库）
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: period
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: 暂估预览
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrirAccrualPreview" }
  /api/v1/finance/grir-accruals/run:
    post:
      operationId: runGrirAccrual
      summary: 运行月末暂估（自动冲回上期）
      description: |
        按会计年月运行暂估。同一租户同一年月若已有 POSTED 暂估单，直接返回已有单（幂等）。
        若存在更早的 POSTED 暂估单，在同一事务中标记为 REVERSED。
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunGrirAccrualRequest" }
      responses:
        "200":
          description: 暂估完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrirAccrual" }
        "403": { description: 当前角色无权运行暂估（仅 ADMIN/FINANCE_MANAGER） }
        "409":
          description: 会计期间已关账或并发冲突
          headers:
            X-Period-Label: { schema: { type: string } }
            X-Error-Code: { schema: { type: string }, example: PERIOD_CLOSED }
        "422": { description: 请求参数校验失败 }
  /api/v1/finance/grir-accruals/{id}:
    get:
      operationId: getGrirAccrual
      summary: 暂估应付详情（含行）
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: 暂估应付详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrirAccrual" }
        "404": { description: 暂估单不存在或不在当前租户范围 }
  /api/v1/finance/grir-accruals/{id}/reverse:
    post:
      operationId: reverseGrirAccrual
      summary: 手动冲回暂估单
      tags: [Finance]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: X-Request-Id
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReverseGrirAccrualRequest" }
      responses:
        "200":
          description: 已冲回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrirAccrual" }
        "403": { description: 当前角色无权冲回暂估 }
        "404": { description: 暂估单不存在或不在当前租户范围 }
        "409":
          description: 期间已关账或已冲回
          headers:
            X-Period-Label: { schema: { type: string } }
            X-Error-Code: { schema: { type: string }, example: PERIOD_CLOSED }
        "422": { description: 冲回原因不满足要求 }
  /api/v1/planning/independent-demands:
    get:
      operationId: listIndependentDemands
      summary: 分页查询当前租户独立需求
      tags: [Planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - name: sourceType
          in: query
          schema: { type: string, enum: [ALL, SALES_ORDER, MANUAL], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 独立需求分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndependentDemandPage" }
    post:
      operationId: createIndependentDemand
      summary: 创建人工独立需求草稿
      tags: [Planning]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIndependentDemandRequest" }
      responses:
        "200":
          description: 已创建人工需求草稿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndependentDemand" }
        "403": { description: 当前角色无权维护计划需求 }
        "422": { description: 物料或需求日期不满足业务约束 }
  /api/v1/planning/independent-demands/{id}:
    get:
      operationId: getIndependentDemand
      summary: 获取独立需求详情
      tags: [Planning]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 独立需求详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndependentDemand" }
        "404": { description: 需求不存在或不可见 }
    put:
      operationId: updateIndependentDemand
      summary: 编辑人工独立需求草稿
      tags: [Planning]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIndependentDemandRequest" }
      responses:
        "200":
          description: 已更新人工需求
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndependentDemand" }
        "409": { description: 来源、状态或版本冲突 }
  /api/v1/planning/independent-demands/{id}/actions:
    post:
      operationId: actOnIndependentDemand
