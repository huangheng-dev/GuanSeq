  /api/v1/equipment/telemetry-field-acceptances/{connectionId}:
    get:
      operationId: getEquipmentTelemetryFieldAcceptance
      summary: 获取真实端点的最新技术预检与现场验收上下文
      description: 仿真端点返回 fieldEligible=false；现场验收状态与技术预检证据相互独立。
      tags: [Equipment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 连接、验收资格、最新预检和验收单上下文
          content: { application/json: { schema: { $ref: "#/components/schemas/EquipmentTelemetryFieldAcceptanceContext" } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
    put:
      operationId: saveEquipmentTelemetryFieldAcceptance
      summary: 创建或修改真实端点的现场验收草稿
      description: 草稿可以不完整；仿真端点永远拒绝建立现场验收单。
      tags: [Equipment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SaveEquipmentTelemetryFieldAcceptanceRequest" } } }
      responses:
        "200":
          description: 验收草稿已创建、修改或幂等返回
          content: { application/json: { schema: { $ref: "#/components/schemas/EquipmentTelemetryFieldAcceptanceContext" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
        "422": { $ref: "#/components/responses/BusinessRuleViolation" }
  /api/v1/equipment/telemetry-field-acceptances/{connectionId}/actions:
    post:
      operationId: actOnEquipmentTelemetryFieldAcceptance
      summary: 提交、批准或驳回现场验收单
      description: 提交与批准必须有最新成功的 FIELD_CANDIDATE_PRECHECK，且六项现场证据完整。
      tags: [Equipment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
