        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EquipmentTelemetryActionRequest" } } }
      responses:
        "200": { description: 连接已启用, content: { application/json: { schema: { $ref: "#/components/schemas/EquipmentTelemetryConnection" } } } }
