      security: [{ bearerAuth: [] }]
      parameters:
        - name: connectionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: pointCode
          in: query
          schema: { type: string, maxLength: 60 }
        - name: quality
          in: query
          schema: { type: string, enum: [ALL, GOOD, UNCERTAIN, BAD], default: ALL }
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: 默认使用结束时间前 24 小时
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: 默认使用当前时间；单次窗口不得超过 31 天
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
