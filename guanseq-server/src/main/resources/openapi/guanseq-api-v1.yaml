openapi: 3.1.0
info:
  title: GuanSeq API
  version: 0.1.0-alpha.1
  description: GuanSeq 制造业务核心 API 契约。
paths:
  /api/v1/platform/status:
    get:
      operationId: getPlatformStatus
      summary: 获取业务核心运行状态
      tags:
        - Platform
      responses:
        "200":
          description: 业务核心可以响应请求
          headers:
            X-Request-Id:
              description: 用于日志和审计追踪的请求编号
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStatus"
  /api/v1/bootstrap/initial-workspace:
    post:
      operationId: bootstrapInitialWorkspace
      summary: 一次性创建首个租户、工厂、工作区和管理员
      description: 仅在部署显式开启且系统尚未初始化时可成功一次；初始化令牌不会写入业务事实。
      tags:
        - Identity
      security: []
      parameters:
        - name: X-GuanSeq-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 32
            writeOnly: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialWorkspaceBootstrapRequest"
      responses:
        "201":
          description: 首个身份与工作区事实已经在同一事务内建立
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialWorkspaceBootstrapResponse"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/me/workspaces:
    get:
      operationId: getMyWorkspaces
      summary: 获取当前用户可访问的工作区
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户、工作区选择版本和可访问工作区
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /api/v1/me/current-workspace:
    put:
      operationId: switchMyWorkspace
      summary: 切换当前用户工作区
      tags:
        - Identity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchWorkspaceRequest"
      responses:
        "200":
          description: 切换后的工作区会话
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/workspace-users:
    get:
      operationId: listCurrentWorkspaceUsers
      summary: 分页查询当前工作区成员与受控角色目录
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema: { type: string, enum: [ALL, ACTIVE, INACTIVE], default: ALL }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 当前工作区成员分页和可分配角色
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceUserPage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
    post:
      operationId: createCurrentWorkspaceUser
      summary: 创建租户内部账号并加入当前工作区
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceUserRequest" }
      responses:
        "201":
          description: 用户和启用成员关系已经创建
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/workspace-users/{userId}:
    put:
      operationId: updateCurrentWorkspaceUser
      summary: 更新当前工作区成员显示名和角色
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceUserRequest" }
      responses:
        "200":
          description: 用户和成员角色已经更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/workspace-users/{userId}/actions:
    post:
      operationId: changeCurrentWorkspaceUserStatus
      summary: 停用或恢复当前工作区成员访问
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUserActionRequest" }
      responses:
        "200":
          description: 成员状态已经更新或目标状态已经满足
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/role-permissions:
    get:
      operationId: listCurrentWorkspaceRolePermissions
      summary: 查询当前工作区受控角色与后端权限矩阵
      description: 仅当前工作区 ADMIN 可读；返回后端显式角色门禁，不提供自定义角色或权限写入。
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 当前工作区受控角色与后端权限目录
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRolePermissionPage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "422": { $ref: "#/components/responses/BusinessRuleViolation" }
  /api/v1/identity/audit-events:
    get:
      operationId: listCurrentWorkspaceAuditEvents
      summary: 分页查询当前工作区治理操作审计
      description: 仅当前工作区 ADMIN 可读；只返回 identity.audit_events 中的身份、成员、角色、组织和工作区治理证据，不跨模块聚合业务单据事件。默认最近 30 天，单次最长 90 天。
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: eventType
          in: query
          schema: { type: string, maxLength: 80 }
        - name: objectType
          in: query
          schema: { type: string, maxLength: 80 }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: query
          in: query
          description: 按请求编号或对象编号模糊查询
          schema: { type: string, maxLength: 120 }
        - name: occurredFrom
          in: query
          schema: { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 当前工作区治理操作审计分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceAuditPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "422": { $ref: "#/components/responses/BusinessRuleViolation" }
  /api/v1/identity/organization-structure:
    get:
      operationId: getCurrentWorkspaceOrganizationStructure
      summary: 查询当前工作区组织层级、负责人和成员归属
      description: 仅当前工作区 ADMIN 可读；范围限定为公司根、当前所在组织及其直属 SITE，不返回其他工作区治理入口。
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 当前工作区最小组织治理页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationStructurePage" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
  /api/v1/identity/organization-structure/units:
    post:
      operationId: createCurrentWorkspaceSiteUnit
      summary: 在当前工厂下创建直属现场单元
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationSiteRequest" }
      responses:
        "201":
          description: 现场单元已创建并返回刷新后的组织页
          content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationStructurePage" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
        "422": { $ref: "#/components/responses/BusinessRuleViolation" }
  /api/v1/identity/organization-structure/units/{unitId}:
    put:
      operationId: updateCurrentWorkspaceOrganizationUnit
      summary: 更新当前所在组织或直属现场单元的名称与负责人
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateOrganizationUnitRequest" } } }
      responses:
        "200": { description: 组织已更新, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationStructurePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/organization-structure/units/{unitId}/actions:
    post:
      operationId: changeCurrentWorkspaceSiteUnitStatus
      summary: 停用或恢复直属现场单元
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationUnitActionRequest" } } }
      responses:
        "200": { description: 现场单元状态已更新, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationStructurePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/organization-structure/workspace:
    put:
      operationId: updateCurrentWorkspaceOrganizationProfile
      summary: 更新当前工作区名称与负责人
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateOrganizationWorkspaceRequest" } } }
      responses:
        "200": { description: 工作区已更新, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationStructurePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
  /api/v1/identity/organization-structure/members/{userId}:
    put:
      operationId: assignCurrentWorkspaceMemberOrganization
      summary: 调整当前工作区成员的组织归属
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssignMemberOrganizationRequest" } } }
      responses:
        "200": { description: 成员归属已更新, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationStructurePage" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/BusinessConflict" }
        "422": { $ref: "#/components/responses/BusinessRuleViolation" }
  /api/v1/masterdata/customers:
    get:
      operationId: listCustomers
      summary: 分页查询当前工作区可见的客户
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 客户分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
    post:
      operationId: createCustomer
      summary: 新建客户
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "200":
          description: 已创建客户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409": { description: 客户编码已存在 }
  /api/v1/masterdata/customers/{id}:
    put:
      operationId: updateCustomer
      summary: 更新客户
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "200":
          description: 已更新客户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { description: 客户不存在或不可见 }
        "409": { description: 版本冲突或客户编码已存在 }
  /api/v1/masterdata/customers/batch:
    patch:
      operationId: batchUpdateCustomers
      summary: 批量更新客户状态或负责人
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterDataBatchRequest" }
      responses:
        "200":
          description: 已更新的客户
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
        "409": { description: 任一记录版本冲突 }
  /api/v1/masterdata/materials:
    get:
      operationId: listMaterials
      summary: 分页查询当前工作区可见的物料
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 物料分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialPage" }
    post:
      operationId: createMaterial
      summary: 新建物料
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaterialRequest" }
      responses:
        "200":
          description: 已创建物料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "409": { description: 物料编码已存在 }
  /api/v1/masterdata/materials/{id}:
    put:
      operationId: updateMaterial
      summary: 更新物料
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMaterialRequest" }
      responses:
        "200":
          description: 已更新物料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "404": { description: 物料不存在或不可见 }
        "409": { description: 版本冲突或物料编码已存在 }
  /api/v1/masterdata/materials/batch:
    patch:
      operationId: batchUpdateMaterials
      summary: 批量更新物料状态或负责人
      tags: [MasterData]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MasterDataBatchRequest" }
      responses:
        "200":
          description: 已更新的物料
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
        "409": { description: 任一记录版本冲突 }
  /api/v1/sales/orders:
    get:
      operationId: listSalesOrders
      summary: 分页查询当前租户销售订单
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 销售订单分页
          headers: { X-Request-Id: { $ref: "#/components/headers/RequestId" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrderPage" }
    post:
      operationId: createSalesOrder
      summary: 创建销售订单草稿
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSalesOrderRequest" }
      responses:
        "200":
          description: 已创建销售订单草稿
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "422": { description: 客户、物料或交期不满足业务约束 }
  /api/v1/sales/orders/{id}:
    get:
      operationId: getSalesOrder
      summary: 获取销售订单详情
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: 销售订单详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "404": { description: 订单不存在或不可见 }
    put:
      operationId: updateSalesOrder
      summary: 编辑草稿或已驳回销售订单
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSalesOrderRequest" }
      responses:
        "200":
          description: 已更新销售订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "409": { description: 状态或版本冲突 }
        "422": { description: 客户、物料或交期不满足业务约束 }
  /api/v1/sales/orders/{id}/actions:
    post:
      operationId: actOnSalesOrder
      summary: 提交、审核、驳回或下达销售订单
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesOrderActionRequest" }
      responses:
        "200":
          description: 状态流转后的销售订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }
        "400": { description: 驳回原因等动作参数无效 }
        "403": { description: 当前角色无权执行动作 }
        "409": { description: 状态或版本冲突 }
  /api/v1/sales/order-reference-data:
    get:
      operationId: getSalesOrderReferenceData
      summary: 获取当前租户可用于订单的客户和物料
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 启用中的客户和物料选项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrderReferenceData" }
  /api/v1/sales/shipments:
    get:
      operationId: listSalesShipments
      summary: 分页查询销售发货单
      tags: [Sales]
