spring:
  application:
    name: guanseq-server
  datasource:
    url: ${GUANSEQ_DB_URL:jdbc:postgresql://localhost:5432/guanseq}
    username: ${GUANSEQ_DB_USERNAME:guanseq}
    password: ${GUANSEQ_DB_PASSWORD:guanseq_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  shutdown: graceful

guanseq:
  build:
    version: ${GUANSEQ_BUILD_VERSION:0.1.0-alpha.1}
  bootstrap:
    enabled: false
    token: disabled
  security:
    mode: disabled
    development-username: disabled
    development-password: disabled
    oidc-username-claim: preferred_username
  telemetry:
    polling-enabled: ${GUANSEQ_TELEMETRY_POLLING_ENABLED:false}
    dispatch-delay-ms: ${GUANSEQ_TELEMETRY_DISPATCH_DELAY_MS:1000}
    retention-scheduler-enabled: ${GUANSEQ_TELEMETRY_RETENTION_SCHEDULER_ENABLED:false}
    retention-dispatch-delay-ms: ${GUANSEQ_TELEMETRY_RETENTION_DISPATCH_DELAY_MS:60000}
