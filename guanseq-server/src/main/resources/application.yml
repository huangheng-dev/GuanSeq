spring:
  application:
    name: guanseq-server
  profiles:
    default: local
  datasource:
    url: ${GUANSEQ_DB_URL:jdbc:postgresql://localhost:5432/guanseq}
    username: ${GUANSEQ_DB_USERNAME:guanseq}
    password: ${GUANSEQ_DB_PASSWORD:guanseq_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  shutdown: graceful

guanseq:
  build:
    version: ${GUANSEQ_BUILD_VERSION:0.1.0-SNAPSHOT}
  security:
    development-identity-enabled: false
    development-username: disabled
    development-password: disabled
