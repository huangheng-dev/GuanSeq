name: 功能建议
description: 提议新的制造业务能力或改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 制造业务场景
      description: 谁在什么条件下遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: 业务事实与责任角色
      description: 涉及哪些对象、状态、权限、数据所有权和证据？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 什么结果能证明闭环完成？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并理解提议不等于已进入路线图。
          required: true
