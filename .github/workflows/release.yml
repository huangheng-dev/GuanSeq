name: Publish preview release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  security:
    uses: ./.github/workflows/release-security.yml

  publish:
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - run: corepack enable

      - name: Verify tag and source versions
        run: pnpm release:check -- --tag "${GITHUB_REF_NAME}"

      - name: Resolve release coordinates
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${version}"
            echo "web=ghcr.io/${owner}/guanseq-web:${version}"
            echo "server=ghcr.io/${owner}/guanseq-server:${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.web }}
          build-args: GUANSEQ_BUILD_VERSION=${{ steps.release.outputs.version }}

      - name: Build and publish server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: ./guanseq-server
          push: true
          tags: ${{ steps.release.outputs.server }}

      - name: Generate web image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.release.outputs.web }}
          format: spdx-json
          output-file: guanseq-web.spdx.json
          upload-artifact: false

      - name: Generate server image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.release.outputs.server }}
          format: spdx-json
          output-file: guanseq-server.spdx.json
          upload-artifact: false

      - name: Create immutable release manifest
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          WEB_IMAGE: ${{ steps.release.outputs.web }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SERVER_IMAGE: ${{ steps.release.outputs.server }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
        run: |
          {
            echo "GuanSeq ${VERSION}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Web image: ${WEB_IMAGE}@${WEB_DIGEST}"
            echo "Server image: ${SERVER_IMAGE}@${SERVER_DIGEST}"
            sha256sum guanseq-web.spdx.json guanseq-server.spdx.json
          } > release-manifest.txt

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --prerelease \
            --title "GuanSeq ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md" \
            guanseq-web.spdx.json \
            guanseq-server.spdx.json \
            release-manifest.txt
