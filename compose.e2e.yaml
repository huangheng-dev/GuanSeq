name: guanseq-e2e

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: guanseq_e2e
      POSTGRES_USER: guanseq
      POSTGRES_PASSWORD: guanseq_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql:size=512m,uid=70,gid=70,mode=0700
    security_opt:
      - no-new-privileges:true

  server:
    image: guanseq/e2e-server:local
    build:
      context: ./guanseq-server
      dockerfile: Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: local
      GUANSEQ_BUILD_VERSION: 0.1.0-E2E
      GUANSEQ_DB_URL: jdbc:postgresql://postgres:5432/guanseq_e2e
      GUANSEQ_DB_USERNAME: guanseq
      GUANSEQ_DB_PASSWORD: guanseq_e2e
      GUANSEQ_DEV_USERNAME: lin.hao
      GUANSEQ_DEV_PASSWORD: guanseq_dev
      GUANSEQ_TELEMETRY_POLLING_ENABLED: "false"
      GUANSEQ_TELEMETRY_RETENTION_SCHEDULER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: guanseq/e2e-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GUANSEQ_BUILD_VERSION: 0.1.0-E2E
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=256m,mode=1777
    environment:
      GUANSEQ_BUILD_VERSION: 0.1.0-E2E
      GUANSEQ_SECURITY_MODE: development
      GUANSEQ_API_BASE_URL: http://server:8080
      GUANSEQ_DEV_USERNAME: lin.hao
      GUANSEQ_DEV_PASSWORD: guanseq_dev
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GUANSEQ_E2E_HTTP_PORT:-3100}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
