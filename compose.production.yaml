name: guanseq

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GUANSEQ_POSTGRES_DB:-guanseq}
      POSTGRES_USER: ${GUANSEQ_POSTGRES_USER:-guanseq}
      POSTGRES_PASSWORD: ${GUANSEQ_DB_PASSWORD:?GUANSEQ_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 18
    volumes:
      - guanseq-postgres-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true

  server:
    image: ${GUANSEQ_SERVER_IMAGE:-guanseq/server}:${GUANSEQ_VERSION:-0.1.0-alpha.1}
    build:
      context: ./guanseq-server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: oidc
      GUANSEQ_BUILD_VERSION: ${GUANSEQ_VERSION:-0.1.0-alpha.1}
      GUANSEQ_DB_URL: jdbc:postgresql://postgres:5432/${GUANSEQ_POSTGRES_DB:-guanseq}
      GUANSEQ_DB_USERNAME: ${GUANSEQ_POSTGRES_USER:-guanseq}
      GUANSEQ_DB_PASSWORD: ${GUANSEQ_DB_PASSWORD:?GUANSEQ_DB_PASSWORD is required}
      GUANSEQ_OIDC_ISSUER_URI: ${GUANSEQ_OIDC_ISSUER_URI:?GUANSEQ_OIDC_ISSUER_URI is required}
      GUANSEQ_OIDC_JWK_SET_URI: ${GUANSEQ_OIDC_JWK_SET_URI:?GUANSEQ_OIDC_JWK_SET_URI is required}
      GUANSEQ_OIDC_AUDIENCE: ${GUANSEQ_OIDC_AUDIENCE:?GUANSEQ_OIDC_AUDIENCE is required}
      GUANSEQ_OIDC_USERNAME_CLAIM: ${GUANSEQ_OIDC_USERNAME_CLAIM:-preferred_username}
      GUANSEQ_BOOTSTRAP_ENABLED: ${GUANSEQ_BOOTSTRAP_ENABLED:-false}
      GUANSEQ_BOOTSTRAP_TOKEN: ${GUANSEQ_BOOTSTRAP_TOKEN:-disabled}
      GUANSEQ_TELEMETRY_POLLING_ENABLED: ${GUANSEQ_TELEMETRY_POLLING_ENABLED:-false}
      GUANSEQ_TELEMETRY_RETENTION_SCHEDULER_ENABLED: ${GUANSEQ_TELEMETRY_RETENTION_SCHEDULER_ENABLED:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=guanseq-server requestId=%X{requestId:-none} logger=%logger{36} message=%msg%n"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: ${GUANSEQ_WEB_IMAGE:-guanseq/web}:${GUANSEQ_VERSION:-0.1.0-alpha.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GUANSEQ_BUILD_VERSION: ${GUANSEQ_VERSION:-0.1.0-alpha.1}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=256m,mode=1777
    environment:
      GUANSEQ_BUILD_VERSION: ${GUANSEQ_VERSION:-0.1.0-alpha.1}
      GUANSEQ_SECURITY_MODE: oidc
      GUANSEQ_API_BASE_URL: http://server:8080
      GUANSEQ_OIDC_ISSUER_URI: ${GUANSEQ_OIDC_ISSUER_URI:?GUANSEQ_OIDC_ISSUER_URI is required}
      GUANSEQ_OIDC_CLIENT_ID: ${GUANSEQ_OIDC_CLIENT_ID:?GUANSEQ_OIDC_CLIENT_ID is required}
      GUANSEQ_OIDC_CLIENT_SECRET: ${GUANSEQ_OIDC_CLIENT_SECRET:?GUANSEQ_OIDC_CLIENT_SECRET is required}
      GUANSEQ_OIDC_CLIENT_AUTH_METHOD: ${GUANSEQ_OIDC_CLIENT_AUTH_METHOD:-client_secret_basic}
      GUANSEQ_OIDC_REDIRECT_URI: ${GUANSEQ_OIDC_REDIRECT_URI:?GUANSEQ_OIDC_REDIRECT_URI is required}
      GUANSEQ_OIDC_POST_LOGOUT_REDIRECT_URI: ${GUANSEQ_OIDC_POST_LOGOUT_REDIRECT_URI:?GUANSEQ_OIDC_POST_LOGOUT_REDIRECT_URI is required}
      GUANSEQ_OIDC_SCOPE: ${GUANSEQ_OIDC_SCOPE:-openid profile}
      GUANSEQ_OIDC_RESOURCE: ${GUANSEQ_OIDC_RESOURCE:-}
      GUANSEQ_SESSION_SECRET: ${GUANSEQ_SESSION_SECRET:?GUANSEQ_SESSION_SECRET is required}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${GUANSEQ_HTTP_BIND_ADDRESS:-127.0.0.1}:${GUANSEQ_HTTP_PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  guanseq-postgres-data:
    name: ${GUANSEQ_POSTGRES_VOLUME:-guanseq-postgres-data}
